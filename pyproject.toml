[project]
name = "planitor"
version = "0.1.0"
description = "Planning and monitoring intelligence for Icelandic planning data."
requires-python = ">=3.11,<3.13"
authors = [
    { name = "Jökull Sólberg", email = "jokull@solberg.is" },
]
dependencies = [
    "aiofiles>=23.2.1,<24",
    "arel>=0.2.0,<0.3",
    "asyncpg>=0.31.0,<1",
    "beautifulsoup4>=4.15.0,<5",
    "boto3>=1.43.25,<2",
    "dramatiq>=1.18.0,<2",
    "email-normalize>=2.0.0,<3",
    "email-validator>=1.3.1,<2",
    "emails>=0.6,<0.7",
    "fastapi>=0.115.14,<0.116",
    "gunicorn>=23.0.0,<24",
    "hashids>=1.3.1,<2",
    "html5lib>=1.1,<2",
    "iceaddr>=0.5.10,<0.6",
    "jinja2>=3.1.6,<4",
    "passlib[bcrypt]>=1.7.4,<2",
    "pdfplumber>=0.11.9,<0.12",
    "psycopg2-binary>=2.9.12,<3",
    "pydantic>=1.10.26,<2",
    "pyjwt[crypto]>=1.7.1,<2",
    "python-multipart>=0.0.32,<0.1",
    "redis>=5.2.1,<6",
    "requests>=2.34.2,<3",
    "reynir>=3.6.1,<4",
    "scrapy>=2.16.0,<3",
    "sentry-dramatiq>=0.3.3,<0.4",
    "sentry-sdk>=1.45.1,<2",
    "skipulagsstofnun>=0.2.1,<0.3",
    "sqlakeyset>=2.0.1775222100,<3",
    "sqlalchemy>=2.0.50,<2.1",
    "sqlalchemy-utils>=0.42.1,<0.43",
    "tokenizer>=3.6.2,<4",
    "uvicorn[standard]>=0.30.6,<0.31",
    "zeep>=4.3.2,<5",
]

[dependency-groups]
dev = [
    "black>=25.12.0,<26",
    "bpython>=0.25,<0.26",
    "flake8>=7.3.0,<8",
    "httpx>=0.28.1,<0.29",
    "ipdb>=0.13.13,<0.14",
    "ipython>=9.8.0,<10",
    "isort>=7.0.0,<8",
    "linetimer>=0.1.4,<0.2",
    "migra>=3.0.1663481299,<4",
    "mypy>=1.19.0,<2",
    "pytest>=9.0.2,<10",
    "pytest-mock>=3.15.1,<4",
    "sqlalchemy-stubs>=0.4,<0.5",
    "tableprint>=0.9.1,<0.10",
    "tabulate>=0.9.0,<0.10",
    "typer>=0.20.0,<0.21",
]

[tool.uv]
package = false

[tool.uv.dependency-groups]
dev = { requires-python = ">=3.11,<3.13" }
